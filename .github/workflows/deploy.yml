name: Deploy

# Runs after CI succeeds on main/master, or via manual "Run workflow".
# Requires repo secret: RENDER_DEPLOY_HOOK_URL (Render → Service → Deploy Hook)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' ||
        github.event.workflow_run.head_branch == 'master'))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy (after green CI)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not set."
            echo "CD is not connected yet. Follow DEPLOY.md:"
            echo "  1) Create Render Docker service from this repo / render.yaml"
            echo "  2) Copy Deploy Hook URL"
            echo "  3) Add GitHub Actions secret RENDER_DEPLOY_HOOK_URL"
            exit 0
          fi

          echo "CI is green — requesting Render redeploy..."
          HTTP_CODE=$(curl -sS -o /tmp/render-hook-body.txt -w "%{http_code}" \
            -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "Render response HTTP $HTTP_CODE"
          cat /tmp/render-hook-body.txt || true
          echo

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Deploy hook failed with HTTP $HTTP_CODE"
            exit 1
          fi

          echo "Deploy hook accepted. Watch the Render dashboard for the build."
